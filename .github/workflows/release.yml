name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # ── Build Linux (ecu_studio PC) ────────────────────────────────────────
  build-linux:
    name: Build Linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Version depuis le tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"           # ex: v1.8.1
          VER="${TAG#v}"                     # ex: 1.8.1
          # versionCode = MAJOR*10000 + MINOR*100 + PATCH
          IFS='.' read -r MAJ MIN PAT <<< "$VER"
          CODE=$(( MAJ * 10000 + MIN * 100 + PAT ))
          echo "version=$VER"   >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"       >> "$GITHUB_OUTPUT"
          echo "code=$CODE"     >> "$GITHUB_OUTPUT"

      - name: Dépendances Qt6 + libs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev qt6-charts-dev qt6-serialbus-dev qt6-serialport-dev \
            libusb-1.0-0-dev libgit2-dev liblua5.4-dev \
            nlohmann-json3-dev cmake ninja-build

      - name: Build ecu_studio
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DECU_MPPS_SIMULATION=ON \
            -DECU_BUILD_TESTS=OFF \
            -DECU_VERSION_OVERRIDE="${{ steps.ver.outputs.version }}" \
            -G Ninja
          cmake --build build --target ecu_studio -j$(nproc)
          strip build/apps/ecu-studio/ecu_studio

      - name: Upload artifact Linux
        uses: actions/upload-artifact@v4
        with:
          name: ecu_studio-linux
          path: build/apps/ecu-studio/ecu_studio

  # ── Build Android APK (ecu_drive) ──────────────────────────────────────
  build-android:
    name: Build Android APK
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Version depuis le tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          IFS='.' read -r MAJ MIN PAT <<< "$VER"
          CODE=$(( MAJ * 10000 + MIN * 100 + PAT ))
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "code=$CODE"   >> "$GITHUB_OUTPUT"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: NDK 26
        run: sdkmanager "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Qt6 Android arm64
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: linux
          target: android
          arch: android_arm64_v8a
          modules: qtcharts qtserialbus qtserialport qtnetwork

      - name: Patch AndroidManifest.xml
        run: |
          sed -i \
            -e 's/android:versionCode="[^"]*"/android:versionCode="${{ steps.ver.outputs.code }}"/' \
            -e 's/android:versionName="[^"]*"/android:versionName="${{ steps.ver.outputs.version }}"/' \
            apps/ecu-drive/android/AndroidManifest.xml

      - name: Build APK
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}
        run: |
          cmake -B build-android \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DQt6_DIR="$Qt6_DIR" \
            -DECU_VERSION_OVERRIDE="${{ steps.ver.outputs.version }}" \
            -DECU_MPPS_SIMULATION=ON \
            -DECU_BUILD_TESTS=OFF \
            -G Ninja
          cmake --build build-android --target ecu_drive_apk -j$(nproc)

      - name: Trouver l'APK
        id: apk
        run: |
          APK=$(find build-android -name "ecu_drive*.apk" | grep -v "unsigned" | head -1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Signer l'APK
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: ${{ steps.apk.outputs.path }}
          signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload artifact APK
        uses: actions/upload-artifact@v4
        with:
          name: ecu_drive-android
          path: ${{ steps.apk.outputs.path }}

  # ── Créer la GitHub Release avec les assets ────────────────────────────
  release:
    name: GitHub Release
    needs: [build-linux, build-android]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Renommer les binaires
        run: |
          TAG="${GITHUB_REF_NAME}"
          mv dist/ecu_studio-linux/ecu_studio        dist/ecu_studio-linux-${TAG}
          mv dist/ecu_drive-android/ecu_drive*.apk   dist/ecu_drive-${TAG}.apk 2>/dev/null || true
          chmod +x dist/ecu_studio-linux-${TAG}

      - name: Créer la Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "${{ github.ref_name }}"
          body: |
            Release ${{ github.ref_name }} — générée automatiquement par CI.

            **Android** : télécharge `ecu_drive-${{ github.ref_name }}.apk` et installe-le.
            L'app détecte les nouvelles versions automatiquement via le menu Mise à jour.

            **Linux PC** : télécharge `ecu_studio-linux-${{ github.ref_name }}` et lance-le.
          files: |
            dist/ecu_studio-linux-${{ github.ref_name }}
            dist/ecu_drive-${{ github.ref_name }}.apk
          fail_on_unmatched_files: false
