name: Release

on:
  push:
    tags:
      - 'v*'
  # Build téléchargeable à la demande (sans tag) : artefacts du run, pas de Release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      name: ${{ steps.v.outputs.name }}
      code: ${{ steps.v.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            # workflow_dispatch : version CMakeLists par défaut (override vide côté AppImage)
            echo "name=0.0.0-ci" >> "$GITHUB_OUTPUT"
          fi
          echo "code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

  apk:
    needs: version
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/android.yml
    with:
      version_name: ${{ needs.version.outputs.name }}
      version_code: ${{ needs.version.outputs.code }}
      require_release_key: true
    secrets: inherit

  appimage:
    runs-on: ubuntu-24.04
    needs: version
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            cmake ninja-build git pkg-config patchelf libfuse2 \
            qt6-base-dev qt6-charts-dev qt6-declarative-dev \
            qt6-serialbus-dev qt6-serialport-dev qt6-connectivity-dev \
            qt6-tools-dev qt6-tools-dev-tools libqt6opengl6-dev \
            libgl1-mesa-dev libssl-dev \
            libusb-1.0-0-dev libgit2-dev \
            lua5.4 liblua5.4-dev \
            nlohmann-json3-dev libgtest-dev \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-xkb1 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-util1 libegl1 libgbm1

      - name: CMake configure
        run: |
          VERSION_OVERRIDE=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION_OVERRIDE="-DECU_VERSION_OVERRIDE=${GITHUB_REF_NAME#v}"
          fi
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DECU_MPPS_SIMULATION=OFF \
            -DECU_BUILD_TESTS=OFF \
            -DECU_BUILD_SOCKETSPY=OFF \
            -DECU_BUILD_ECU_DRIVE=OFF \
            ${VERSION_OVERRIDE} \
            -G Ninja

      - name: CMake build
        run: cmake --build build --target ecu_studio --parallel "$(nproc)"

      - name: Download linuxdeploy and Qt plugin
        run: |
          curl -fsSL -o /tmp/linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSL -o /tmp/linuxdeploy-plugin-qt \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x /tmp/linuxdeploy /tmp/linuxdeploy-plugin-qt

      - name: Build AppImage
        run: |
          DESTDIR=/tmp/appdir cmake --install build
          QT_PLUGIN_DIR="$(qmake6 -query QT_INSTALL_PLUGINS 2>/dev/null || echo /usr/lib/x86_64-linux-gnu/qt6/plugins)"
          mkdir -p /tmp/appdir/usr/plugins/tls
          cp "${QT_PLUGIN_DIR}/tls/"*.so /tmp/appdir/usr/plugins/tls/ 2>/dev/null || true
          LIBUSB="$(ldconfig -p | awk '/libusb-1.0\.so\.0/{print $NF; exit}')"
          echo "Bundling libusb: ${LIBUSB:-INTROUVABLE}"
          EXTRA_QT_MODULES="charts;serialbus;serialport;concurrent;sql;network;opengl" \
          QMAKE="$(command -v qmake6)" \
          /tmp/linuxdeploy \
            --appdir /tmp/appdir \
            --executable /tmp/appdir/usr/bin/ecu_studio \
            --desktop-file apps/ecu-studio/resources/ecu-studio.desktop \
            --icon-file scripts/dist/ecu-studio.png \
            ${LIBUSB:+--library "$LIBUSB"} \
            --plugin qt \
            --output appimage
          produced="$(ls ECU*Studio*.AppImage | head -1)"
          if [ "$produced" != "ECU_Studio-x86_64.AppImage" ]; then
            mv "$produced" "ECU_Studio-x86_64.AppImage"
          fi
          ls -la ECU_Studio-x86_64.AppImage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: ECU_Studio-x86_64.AppImage
          path: ECU_Studio-x86_64.AppImage
          if-no-files-found: error

      - name: Sign release manifest
        if: startsWith(github.ref, 'refs/tags/')
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::warning::UPDATE_SIGNING_KEY absent — AppImage publiée SANS manifeste signé."
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          APPIMAGE="ECU_Studio-x86_64.AppImage"
          SHA256=$(sha256sum "$APPIMAGE" | awk '{print $1}')
          printf '{\n  "version": "%s",\n  "filename": "%s",\n  "sha256": "%s"\n}\n' \
              "$VERSION" "$APPIMAGE" "$SHA256" > release-manifest.json
          echo "$UPDATE_SIGNING_KEY" > /tmp/_sign_key.pem
          chmod 600 /tmp/_sign_key.pem
          openssl pkeyutl -sign -inkey /tmp/_sign_key.pem -rawin \
              -in release-manifest.json -out release-manifest.json.sig
          rm -f /tmp/_sign_key.pem
          echo "Manifest signed for v${VERSION} (sha256=${SHA256})"
          cat release-manifest.json

      - name: Upload manifest artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: |
            release-manifest.json
            release-manifest.json.sig
          if-no-files-found: ignore

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, apk, appimage]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download AppImage
        uses: actions/download-artifact@v4
        with:
          name: ECU_Studio-x86_64.AppImage

      - name: Download manifest (optional)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: release-manifest

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: ecu-drive-arm64-apk

      - name: Rename APK with version
        run: |
          mv ecu-drive-arm64.apk "ecu-drive-${GITHUB_REF_NAME}-arm64.apk"
          ls -la ECU_Studio-x86_64.AppImage "ecu-drive-${GITHUB_REF_NAME}-arm64.apk"
          ls -la release-manifest.json* 2>/dev/null || echo "(pas de manifeste signé)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: false
          body: |
            ## Installation

            **PC / Linux (x86-64)** — `ECU_Studio-x86_64.AppImage`

            **Android (arm64)** — `ecu-drive-*-arm64.apk` (ECU Drive) :
            ouvrez-le sur le téléphone (autorisez l'installation depuis cette source),
            ou `adb install -r ecu-drive-*-arm64.apk`.

            Signé avec la clé de publication du projet : les versions suivantes
            s'installent **par-dessus**. ECU Drive propose la mise à jour au démarrage.
          files: |
            ECU_Studio-x86_64.AppImage
            ecu-drive-${{ github.ref_name }}-arm64.apk
            release-manifest.json
            release-manifest.json.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
